<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QUANTUM" xmlns:c2pa="http://c2pa.org/manifest">
  <title>QUANTUM</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a44"/>
      <stop offset="1" stop-color="#040913"/>
    </linearGradient>
    <linearGradient id="orbCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="orbViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="orbMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="candleGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tile with a fine edge highlight -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="22" y="22" width="468" height="468" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Instrument ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- Core glow -->
  <circle cx="256" cy="256" r="150" fill="url(#core)"/>

  <!-- Quantum orbits -->
  <g fill="none" stroke-width="7" filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="190" ry="72" stroke="url(#orbCyan)" transform="rotate(-28 256 256)"/>
    <ellipse cx="256" cy="256" rx="190" ry="72" stroke="url(#orbViolet)" transform="rotate(32 256 256)"/>
    <ellipse cx="256" cy="256" rx="190" ry="72" stroke="url(#orbMint)" transform="rotate(90 256 256)" stroke-width="5"/>
  </g>

  <!-- Electron nodes -->
  <g filter="url(#glow)">
    <circle cx="424" cy="167" r="10" fill="#67e8f9"/>
    <circle cx="95" cy="155" r="9" fill="#f0abfc"/>
    <circle cx="256" cy="446" r="9" fill="#6ee7b7"/>
  </g>

  <!-- Price-level line through the candle -->
  <line x1="150" y1="262" x2="362" y2="262" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Candlestick at the center -->
  <g filter="url(#glow)">
    <line x1="256" y1="168" x2="256" y2="344" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <rect x="222" y="206" width="68" height="104" rx="8" fill="url(#candleGreen)"/>
    <rect x="236" y="218" width="12" height="60" rx="6" fill="#ffffff" opacity="0.45"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
