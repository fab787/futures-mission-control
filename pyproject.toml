[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-mission-control"
version = "0.3.0"
description = "Modular futures market intelligence and paper-trading research dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "PyYAML>=6.0,<7.0",
  "mcp>=2.3,<3.0",
  "keyring>=25,<26",
  "tzdata>=2024.1",
  "yfinance>=0.2.40,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "matplotlib>=3.9,<4.0",
  "scipy>=1.13,<2.0",
  "statsmodels>=0.14,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mission_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
